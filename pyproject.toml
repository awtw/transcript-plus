[project]
name = "transcript-plus-core"
version = "0.1.0"
description = "Transcript Plus offline desktop core"
requires-python = ">=3.11,<3.14"
dependencies = ["regex>=2024.11"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
packaging = ["pyinstaller>=6.16,<7"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/transcript_plus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]

