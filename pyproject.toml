[project]
name = "transcript-plus-core"
version = "0.1.0"
description = "Transcript Plus offline desktop core"
requires-python = ">=3.11,<3.14"
dependencies = ["regex>=2024.11"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2", "mlx-whisper>=0.4.3,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'"]
diarization = ["sherpa-onnx==1.13.7", "sherpa-onnx-core==1.13.7", "psutil>=7,<8", "numpy>=1.26,<3"]
packaging = ["pyinstaller>=6.16,<7"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/transcript_plus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]

