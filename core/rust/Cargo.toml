[package]
name = "transcript-core"
version = "0.1.0"
edition = "2021"
description = "Transcript Plus shared core for iOS/Android (domain rules, storage)"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-segmentation = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
